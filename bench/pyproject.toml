[project]
name = "ming-tts-bench"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "kaldi-native-fbank>=1.22.5",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[tool.uv]
# The official code pins torch 2.6.0 and transformers 4.46.3; mlx-audio needs
# transformers 5 and mlx-whisper a newer torch. `uv run --group X` syncs .venv to X.
conflicts = [
    [{ group = "torch" }, { group = "mlx-audio" }],
    [{ group = "torch" }, { group = "quality" }],
]

[dependency-groups]
mlx-audio = [
    "mlx-audio==0.6.3",
]
quality = [
    "jiwer>=4.0.0",
    "mlx-whisper>=0.4.3",
]
torch = [
    "accelerate==1.3.0",
    "diffusers==0.33.0",
    "einops>=0.8.2",
    "huggingface-hub>=0.36.2",
    "inflect>=7.6.0",
    "loguru>=0.7.3",
    "packaging>=26.3",
    "tokenizers>=0.20.3",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "tqdm>=4.70.1",
    "transformers==4.46.3",
    "x-transformers==2.9.2",
]
