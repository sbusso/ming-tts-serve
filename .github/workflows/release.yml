name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  XCODE_VERSION: "26.6"
  ZIG_VERSION: "0.17.0"
  ZIG_SHA256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a

jobs:
  release:
    # Dependabot never starts a build.
    if: github.actor != 'dependabot[bot]'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Check that the tag matches build.zig.zon
        run: |
          zon="$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)"
          [ "v$zon" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != build.zig.zon version $zon"; exit 1; }

      - uses: ./.github/actions/setup

      - name: Run the unit tests
        run: zig build test --summary all

      - name: Package
        run: scripts/package.sh "$GITHUB_REF_NAME"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="ming-tts-serve-${GITHUB_REF_NAME#v}-macos-arm64"
          gh release create "$GITHUB_REF_NAME" \
            "dist/$name.tar.gz" "dist/$name.tar.gz.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
